<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" width="100%" height="100%">
  <defs>
    <!-- Deep Dark Engineering Backgrounds -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="45%" stop-color="#0A0F1D" />
      <stop offset="100%" stop-color="#070B14" />
    </linearGradient>

    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#090D16" stop-opacity="0.96" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <linearGradient id="dotnetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6D28D9" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>

    <linearGradient id="statusGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Subtle Blueprint Grid -->
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1E293B" stroke-width="0.6" stroke-opacity="0.55" />
      <circle cx="28" cy="28" r="0.8" fill="#334155" opacity="0.5" />
    </pattern>

    <!-- Ambient Glows -->
    <filter id="glowBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="32" />
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="1100" height="320" rx="16" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5" />
  <rect width="1100" height="320" rx="16" fill="url(#grid)" />

  <!-- Ambient Lighting -->
  <circle cx="180" cy="80" r="130" fill="#22D3EE" opacity="0.06" filter="url(#glowBlur)" />
  <circle cx="850" cy="160" r="150" fill="#6D28D9" opacity="0.08" filter="url(#glowBlur)" />
  <circle cx="580" cy="260" r="110" fill="#10B981" opacity="0.05" filter="url(#glowBlur)" />

  <!-- Top System Header Bar -->
  <rect x="1" y="1" width="1098" height="38" rx="15" fill="#04070E" />
  <line x1="0" y1="39" x2="1100" y2="39" stroke="#1E293B" stroke-width="1" />

  <!-- Window Controls -->
  <circle cx="24" cy="20" r="6" fill="#EF4444" opacity="0.9" />
  <circle cx="44" cy="20" r="6" fill="#F59E0B" opacity="0.9" />
  <circle cx="64" cy="20" r="6" fill="#10B981" opacity="0.9" />

  <!-- Terminal Path -->
  <text x="92" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" fill="#94A3B8" font-weight="600">
    serf03@architecture-node:~/production-systems
  </text>

  <!-- Right Top Telemetry Pills -->
  <g transform="translate(765, 9)">
    <rect x="0" y="0" width="150" height="22" rx="5" fill="#0B1324" stroke="#1E293B" stroke-width="1" />
    <circle cx="14" cy="11" r="4" fill="#10B981" />
    <text x="26" y="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#E2E8F0" font-weight="600">SYSTEM: ONLINE</text>

    <rect x="160" y="0" width="160" height="22" rx="5" fill="#0B1324" stroke="#1E293B" stroke-width="1" />
    <text x="240" y="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#38BDF8" font-weight="600" text-anchor="middle">ARCH: MULTI-TENANT</text>
  </g>

  <!-- ==========================================
       LEFT SECTION: IDENTITY & CORE STACK MATRIX
       ========================================== -->
  <g transform="translate(42, 68)">
    <!-- Command Prompt Line -->
    <rect x="0" y="0" width="8" height="16" rx="2" fill="#22D3EE" />
    <text x="16" y="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#22D3EE" font-weight="700" letter-spacing="1">
      SOFTWARE ARCHITECT · FULL-STACK ENGINEER
    </text>

    <!-- Main Name & Handle -->
    <text x="0" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="44" font-weight="800" fill="#F8FAFC" letter-spacing="-1">
      Ismael Aybar
    </text>
    <text x="278" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="700" fill="#22D3EE">
      @serf03
    </text>

    <!-- Value Proposition -->
    <text x="0" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="15" font-weight="500" fill="#94A3B8">
      Sistemas Comerciales POS · Plataformas SaaS · Microservicios · PropTech &amp; GIS · Automatización
    </text>

    <!-- Divider -->
    <line x1="0" y1="110" x2="545" y2="110" stroke="#1E293B" stroke-width="1" />

    <!-- HIGH-PRIORITY TECH STACK BADGES (Row 1: Backend & Core) -->
    <text x="0" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#64748B" font-weight="700" letter-spacing="0.8">
      CORE BACKEND &amp; RUNTIMES
    </text>

    <g transform="translate(0, 138)">
      <!-- C# / .NET -->
      <rect x="0" y="0" width="96" height="28" rx="6" fill="url(#dotnetGrad)" stroke="#8B5CF6" stroke-width="1" />
      <text x="48" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">C# / .NET</text>

      <!-- Node.js -->
      <rect x="104" y="0" width="88" height="28" rx="6" fill="#0F172A" stroke="#22C55E" stroke-width="1" stroke-opacity="0.7" />
      <text x="148" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#4ADE80" text-anchor="middle">Node.js</text>

      <!-- NestJS -->
      <rect x="200" y="0" width="82" height="28" rx="6" fill="#0F172A" stroke="#F43F5E" stroke-width="1" stroke-opacity="0.7" />
      <text x="241" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#FB7185" text-anchor="middle">NestJS</text>

      <!-- TypeScript -->
      <rect x="290" y="0" width="104" height="28" rx="6" fill="#0F172A" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.8" />
      <text x="342" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#60A5FA" text-anchor="middle">TypeScript</text>

      <!-- Python / FastAPI -->
      <rect x="402" y="0" width="142" height="28" rx="6" fill="#0F172A" stroke="#14B8A6" stroke-width="1" stroke-opacity="0.7" />
      <text x="473" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#2DD4BF" text-anchor="middle">Python · FastAPI</text>
    </g>

    <!-- HIGH-PRIORITY TECH STACK BADGES (Row 2: Data, Frontend & Infra) -->
    <text x="0" y="188" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#64748B" font-weight="700" letter-spacing="0.8">
      DATA · FRONTEND · INFRASTRUCTURE
    </text>

    <g transform="translate(0, 196)">
      <!-- SQL Server -->
      <rect x="0" y="0" width="102" height="28" rx="6" fill="#0F172A" stroke="#EF4444" stroke-width="1" stroke-opacity="0.75" />
      <text x="51" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700" fill="#F87171" text-anchor="middle">SQL Server</text>

      <!-- PostgreSQL -->
      <rect x="110" y="0" width="104" height="28" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.75" />
      <text x="162" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700" fill="#38BDF8" text-anchor="middle">PostgreSQL</text>

      <!-- Redis & Mongo -->
      <rect x="222" y="0" width="122" height="28" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.75" />
      <text x="283" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700" fill="#FBBF24" text-anchor="middle">Redis · Mongo</text>

      <!-- React / Next.js -->
      <rect x="352" y="0" width="114" height="28" rx="6" fill="#0F172A" stroke="#22D3EE" stroke-width="1" stroke-opacity="0.75" />
      <text x="409" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700" fill="#67E8F9" text-anchor="middle">React · Next</text>

      <!-- Docker / Linux -->
      <rect x="474" y="0" width="116" height="28" rx="6" fill="#0F172A" stroke="#6366F1" stroke-width="1" stroke-opacity="0.75" />
      <text x="532" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700" fill="#818CF8" text-anchor="middle">Docker · Linux</text>
    </g>
  </g>

  <!-- ==========================================
       RIGHT SECTION: ARCHITECTURE & TELEMETRY HUD
       ========================================== -->
  <g transform="translate(655, 58)">
    <!-- Outer HUD Frame -->
    <rect width="408" height="236" rx="12" fill="url(#panelGrad)" stroke="#1E293B" stroke-width="1.5" />

    <!-- HUD Header -->
    <rect x="1" y="1" width="406" height="30" rx="11" fill="#0B1120" />
    <line x1="0" y1="31" x2="408" y2="31" stroke="#1E293B" stroke-width="1" />
    <text x="16" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8" font-weight="700">
      ◈ ARCHITECTURE TOPOLOGY // PROD
    </text>
    <text x="392" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#10B981" font-weight="700" text-anchor="end">
      ● ACTIVE
    </text>

    <!-- Layer 1: Clients -->
    <g transform="translate(20, 44)">
      <rect x="0" y="0" width="114" height="40" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <text x="57" y="17" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#38BDF8" font-weight="700" text-anchor="middle">WEB &amp; POS UI</text>
      <text x="57" y="31" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#94A3B8" text-anchor="middle">React · Next.js</text>

      <rect x="127" y="0" width="114" height="40" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <text x="184" y="17" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#38BDF8" font-weight="700" text-anchor="middle">MOBILE APPS</text>
      <text x="184" y="31" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#94A3B8" text-anchor="middle">React Native · Expo</text>

      <rect x="254" y="0" width="114" height="40" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <text x="311" y="17" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#38BDF8" font-weight="700" text-anchor="middle">AUTOMATION</text>
      <text x="311" y="31" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#94A3B8" text-anchor="middle">n8n · Webhooks</text>
    </g>

    <!-- Connector Lines 1 -> 2 -->
    <line x1="77" y1="84" x2="77" y2="100" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="2,2" />
    <line x1="204" y1="84" x2="204" y2="100" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="2,2" />
    <line x1="331" y1="84" x2="331" y2="100" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="2,2" />

    <!-- Layer 2: Backend Gateway & Core Services -->
    <g transform="translate(20, 100)">
      <rect x="0" y="0" width="368" height="46" rx="7" fill="#131C31" stroke="#6366F1" stroke-width="1.2" />
      <text x="184" y="19" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#E2E8F0" font-weight="700" text-anchor="middle">
        DISTRIBUTED API &amp; DOMAIN LAYER (RBAC · JWT)
      </text>
      <text x="184" y="35" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#A5B4FC" font-weight="600" text-anchor="middle">
        C# / .NET Core  ·  Node.js / NestJS  ·  Python / FastAPI
      </text>
    </g>

    <!-- Connector Lines 2 -> 3 -->
    <line x1="105" y1="146" x2="105" y2="162" stroke="#818CF8" stroke-width="1.2" stroke-dasharray="2,2" />
    <line x1="295" y1="146" x2="295" y2="162" stroke="#818CF8" stroke-width="1.2" stroke-dasharray="2,2" />

    <!-- Layer 3: Data & Infra -->
    <g transform="translate(20, 162)">
      <rect x="0" y="0" width="178" height="54" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1" stroke-opacity="0.7" />
      <text x="89" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#10B981" font-weight="700" text-anchor="middle">DATA &amp; ORM LAYER</text>
      <text x="89" y="33" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#CBD5E1" text-anchor="middle">SQL Server · PostgreSQL</text>
      <text x="89" y="46" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#94A3B8" text-anchor="middle">EF Core · Prisma · Redis</text>

      <rect x="190" y="0" width="178" height="54" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.7" />
      <text x="279" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#FBBF24" font-weight="700" text-anchor="middle">CLOUD &amp; DELIVERY</text>
      <text x="279" y="33" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#CBD5E1" text-anchor="middle">Docker · Linux · Nginx</text>
      <text x="279" y="46" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#94A3B8" text-anchor="middle">GitHub Actions · PostGIS</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="1" y="316" width="1098" height="3" rx="1.5" fill="url(#accentCyan)" />
</svg>
